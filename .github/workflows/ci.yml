name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # Zed's checkout has paths past Windows's 260-character limit; git fetches it.
      - name: Long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libvulkan-dev libssl-dev pkg-config
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      # `--keep-going` reports every crate's problems in one run.
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      # `--no-fail-fast` runs every test binary, so one run reports every failure.
      - run: cargo test --workspace --no-fail-fast
      - name: Bundle (debug build; ad hoc signature on macOS)
        shell: bash
        run: script/bundle-${{ runner.os == 'macOS' && 'mac' || runner.os == 'Windows' && 'windows' || 'linux' }} --debug

  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 script/check-layers.py

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
      # Every release bundle ships the third-party notices; a crate whose licence cannot be read
      # fails here, before a release does.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: script/generate-licenses
