name: CI

# Pull requests, and every push to main: commits are also pushed to main directly, and the edge
# release builds only a commit whose run here passed (release.yml).
on:
  pull_request:
  push:
    branches: [main]

# A pull request's newer push cancels its older run; main's runs are never cancelled, so each
# commit there keeps its result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Whether a pull request or a push changes more than documentation: Markdown at the root and anything in
  # .specify/, docs/ and specs/. Markdown elsewhere counts as code: the agent panel compiles its
  # skill's files in.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # A pull request's checkout is its merge commit, whose first parent is the base. A push
      # to main is compared with the commit main held before it, which may be several back.
      - id: diff
        env:
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          if [[ -z "$BEFORE" ]]; then
            base=HEAD^1
          elif [[ "$BEFORE" =~ ^0+$ ]] || ! git fetch -q --depth=1 origin "$BEFORE"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            base=$BEFORE
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed"
          if grep -qvE '^[^/]+\.md$|^(\.specify|docs|specs)/' <<< "$changed"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Check (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # Zed's checkout has paths past Windows's 260-character limit; git fetches it.
      - name: Long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v7
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libvulkan-dev libssl-dev pkg-config
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          # A pull request whose lockfile changed starts from the build it had before, rather
          # than from nothing.
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      # `--keep-going` reports every crate's problems in one run.
      - run: cargo clippy --workspace --all-targets --keep-going -- -D warnings
      # `--no-fail-fast` runs every test binary, so one run reports every failure.
      - run: cargo test --workspace --no-fail-fast
      - name: Bundle (debug build; ad hoc signature on macOS)
        shell: bash
        run: script/bundle-${{ runner.os == 'macOS' && 'mac' || runner.os == 'Windows' && 'windows' || 'linux' }} --debug

  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 script/check-layers.py
      - run: python3 script/check-design-tokens.py
      - run: python3 script/check-brand.py
      - run: python3 script/test_release_files.py

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
      # Every release bundle ships the third-party notices; a crate whose licence cannot be read
      # fails here, before a release does.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: Third-party notices
        run: script/generate-licenses
