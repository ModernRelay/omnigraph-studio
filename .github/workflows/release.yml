name: Release

# Push a tag `v<version>` matching the workspace version to build and publish a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run it by hand (`gh workflow run release.yml --ref main`) to build the same files without
# publishing them, to check a release before tagging it.
#
# macOS builds are signed and notarized when the Apple secrets below are set, and signed ad hoc
# otherwise; a tag's release needs them, so an unsigned macOS build is never published
# (spec 017). Linux builds are tarballs, the Windows build a zip.
#
#   APPLE_CERTIFICATE_P12        base64 of a "Developer ID Application" certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD   its export password
#   APPLE_SIGN_IDENTITY          e.g. "Developer ID Application: Modern Relay (TEAMID)"
#   APPLE_NOTARY_KEY_P8          base64 of an App Store Connect API key (.p8)
#   APPLE_NOTARY_KEY_ID          its key ID
#   APPLE_NOTARY_ISSUER          its issuer ID
#
# Studio's updater installs a macOS update only when it is signed with the update key, whose
# public half is crates/studio_update/update-key.pub. Without these the release still says
# which version is newest (latest.json), and Studio offers the download instead:
#
#   STUDIO_UPDATER_KEY           the private key `cargo packager signer generate` writes
#   STUDIO_UPDATER_KEY_PASSWORD  its password

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          # Ubuntu 22.04's glibc (2.35) is the oldest a Linux build runs on (bundle-linux checks).
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      SIGNED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      UPDATER_KEYED: ${{ secrets.STUDIO_UPDATER_KEY != '' }}
    steps:
      # Zed's checkout has paths past Windows's 260-character limit; git fetches it.
      - name: Long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v4

      # The scripts read TOML with Python's tomllib (3.11+); Ubuntu 22.04 has 3.10.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: The tag names the workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not name the workspace version $version" >&2
            exit 1
          fi

      # Every updating Studio and `omnigraph studio` refuse an app not signed with the Developer
      # ID, so a tag's release stops here rather than after the builds.
      - name: A tag's macOS build is signed
        if: github.event_name == 'push' && runner.os == 'macOS' && env.SIGNED != 'true'
        shell: bash
        run: |
          echo "a release needs the Apple secrets listed at the top of release.yml" >&2
          exit 1

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libvulkan-dev libssl-dev pkg-config

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      # The third-party notices every bundle ships (script/generate-licenses).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # A release compiles GPUI's Metal shaders at build time, which needs Xcode's compiler.
      - name: Metal compiler
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx -f metal

      - name: Signing and notarization credentials
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials studio-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --keychain "$keychain"
          rm "$RUNNER_TEMP/notary.p8"
          echo "STUDIO_SIGN_IDENTITY=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "STUDIO_NOTARY_PROFILE=studio-notary" >> "$GITHUB_ENV"

      - name: Bundle (release build)
        shell: bash
        run: script/bundle-${{ runner.os == 'macOS' && 'mac' || runner.os == 'Windows' && 'windows' || 'linux' }}

      # The requirement `omnigraph studio` checks before it opens or installs Studio (RFC #1017).
      - name: The app passes the Developer ID requirement
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          team=$(sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p' <<< "$APPLE_SIGN_IDENTITY")
          if [[ -z "$team" ]]; then
            echo "APPLE_SIGN_IDENTITY names no team: \"Developer ID Application: Name (TEAMID)\"" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 \
            -R="identifier \"com.modernrelay.omnigraph-studio\" and anchor apple generic and certificate leaf[subject.OU] = \"$team\"" \
            "target/bundle/Omnigraph Studio.app"

      - uses: taiki-e/install-action@v2
        if: runner.os == 'macOS' && env.UPDATER_KEYED == 'true'
        with:
          tool: cargo-packager@0.11.8

      # Writes the .sig beside the update archive: base64 of its minisign signature.
      - name: Sign the update
        if: runner.os == 'macOS' && env.UPDATER_KEYED == 'true'
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.STUDIO_UPDATER_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.STUDIO_UPDATER_KEY_PASSWORD }}
        run: |
          for update in target/bundle/*.app.tar.gz; do
            cargo packager signer sign "$update"
          done

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp target/bundle/*.dmg target/bundle/*.tar.gz target/bundle/*.sig target/bundle/*.zip dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The first-install files under names without the version, which `latest/download` always
      # serves, and latest.json for Studio's updater (spec 017).
      - name: Version-free copies and the update manifest
        run: python3 script/release-files.py dist "${GITHUB_REF_NAME#v}"

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ "$SIGNED" == "true" ]]; then
            mac="The macOS app is signed with a Developer ID and notarized."
          else
            mac="The macOS app is signed ad hoc, not notarized. macOS blocks it the first time: open System Settings → Privacy & Security and choose Open Anyway, or run \`xattr -dr com.apple.quarantine \"/Applications/Omnigraph Studio.app\"\` after moving it to Applications."
          fi
          cat > notes.md <<NOTES
          Omnigraph Studio $version, built from ${GITHUB_SHA::7} by the release workflow.

          | File | Platform |
          |---|---|
          | \`Omnigraph-Studio-$version-arm64.dmg\` | macOS 11 or later, Apple silicon |
          | \`omnigraph-studio-$version-linux-x86_64.tar.gz\` | Linux x86_64, glibc 2.35 or later (Ubuntu 22.04, Debian 12 and later); Wayland or X11, Vulkan |
          | \`omnigraph-studio-$version-linux-aarch64.tar.gz\` | Linux arm64, glibc 2.35 or later; Wayland or X11, Vulkan |
          | \`omnigraph-studio-$version-windows-x86_64.zip\` | Windows 10 (1809) or later, x86_64 |

          The same four files without the version in their names are always the newest release's, at \`https://github.com/$GITHUB_REPOSITORY/releases/latest/download/<name>\`. \`Omnigraph-Studio-$version-arm64.app.tar.gz\` with its \`.sig\`, and \`latest.json\`, are for Studio's own updater.

          \`SHA256SUMS\` lists every file's checksum. Each download carries \`LICENSE\` (GPL-3.0-or-later) and \`THIRD-PARTY-NOTICES.md\`, the licences of the crates, fonts, icons and themes it includes.

          $mac

          On Linux, unpack the tarball and run \`bin/omnigraph-studio\`; copy its \`share/\` into \`~/.local/share\` to list Studio, with its icon, in a launcher.

          On Windows, unzip anywhere and run \`omnigraph-studio.exe\`. It is not signed, so SmartScreen may ask first: choose More info, then Run anyway.

          Studio connects to an Omnigraph server that speaks HTTP contract 0.14 (edge-20261020-7fd9cc9 or later); see the README for connecting and for a sample graph.
          NOTES
          # A full release, so `latest` names it: Studio's updater and the CLI read it there.
          flags=(--latest)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Omnigraph Studio $version" --notes-file notes.md "${flags[@]}"
