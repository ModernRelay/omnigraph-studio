name: Release

# Push a tag `v<version>` matching the workspace version to build and publish a release:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# Run it by hand (`gh workflow run release.yml --ref main`) to build the same files without
# publishing them, to check a release before tagging it.
#
# Once a day it builds main's tip and publishes it as the `edge` release, unless `edge` already
# holds that commit; `gh workflow run release.yml --ref main -f edge=true` does it now. `edge` is
# a pre-release that is never `latest` and carries no latest.json and no update signature, so
# no updating Studio and no `omnigraph studio` installs it: it is for people who download it on
# purpose, at `releases/download/edge/<name>` under the version-free names. Each new edge build
# replaces the last, release and tag. It is built only once ci.yml's run on that commit of main
# has passed; the edge job waits for a run still going.
#
# macOS builds are signed and notarized when the Apple secrets below are set, and signed ad hoc
# otherwise. A tag's release is the latest only when they are set: without them it is published
# as a pre-release, which neither Studio's updater nor `omnigraph studio` reads (both take
# `latest`), so no unsigned app reaches them (spec 017). Linux builds are tarballs, the Windows
# build a zip.
#
#   APPLE_CERTIFICATE_P12        base64 of a "Developer ID Application" certificate (.p12)
#   APPLE_CERTIFICATE_PASSWORD   its export password
#   APPLE_SIGN_IDENTITY          e.g. "Developer ID Application: Modern Relay (TEAMID)"
#   APPLE_NOTARY_KEY_P8          base64 of an App Store Connect API key (.p8)
#   APPLE_NOTARY_KEY_ID          its key ID
#   APPLE_NOTARY_ISSUER          its issuer ID
#
# Studio's updater installs a macOS update only when it is signed with the update key, whose
# public half is crates/studio_update/update-key.pub. The `sign-update` job signs it, for a tag
# only, with these secrets of the `update-signing` environment (give that environment required
# reviewers, so a workflow change alone cannot sign a release). While update-key.pub is empty
# the release still says which version is newest (latest.json), and Studio offers the download
# instead; once it holds the key, a release without a signature is refused.
#
#   STUDIO_UPDATER_KEY           the private key `cargo packager signer generate` writes
#   STUDIO_UPDATER_KEY_PASSWORD  its password

on:
  push:
    tags: ["v*"]
  schedule:
    # Daily, off the hour that scheduled workflows crowd.
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      edge:
        description: Publish the build as the edge release (main only)
        type: boolean
        default: false

# Only the publish job writes; the builds and the signing read.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Whether this run publishes an edge build: the schedule, or a dispatch with `edge`, on main,
  # and only when `edge` does not already hold main's tip and CI passed on it.
  edge:
    name: Edge
    if: github.event_name == 'schedule' || inputs.edge
    runs-on: ubuntu-24.04
    # Long enough for CI on main's tip to finish.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.fresh.outputs.publish }}
    steps:
      - id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "an edge build is made from main, not $GITHUB_REF" >&2
            exit 1
          fi
          held=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/edge" --jq .object.sha 2>/dev/null || true)
          if [[ "$held" == "$GITHUB_SHA" ]]; then
            echo "edge already holds ${GITHUB_SHA::7}; nothing to publish"
            exit 0
          fi
          # CI's run for this push of main; a commit with none (pushed before CI ran on main) is
          # not built.
          while :; do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion,url \
              --jq '.[0] // empty | "\(.status) \(.conclusion) \(.url)"')
            if [[ -z "$run" ]]; then
              echo "CI has no run on ${GITHUB_SHA::7}; no edge build" >&2
              exit 1
            fi
            read -r status conclusion url <<< "$run"
            [[ "$status" == completed ]] && break
            echo "CI on ${GITHUB_SHA::7} is $status: $url"
            sleep 60
          done
          if [[ "$conclusion" != success ]]; then
            echo "CI on ${GITHUB_SHA::7} ended $conclusion; no edge build: $url" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: edge
    # Every tag and check run builds; an edge run only when it has something to publish.
    if: ${{ !cancelled() && (needs.edge.result == 'skipped' || needs.edge.outputs.publish == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: macos-arm64
          # Ubuntu 22.04's glibc (2.35) is the oldest a Linux build runs on (bundle-linux checks).
          - os: ubuntu-22.04
            target: linux-x86_64
          - os: ubuntu-22.04-arm
            target: linux-aarch64
          - os: windows-2025
            target: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      SIGNED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
    steps:
      # Zed's checkout has paths past Windows's 260-character limit; git fetches it.
      - name: Long paths
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
        shell: bash
      - uses: actions/checkout@v7

      # The scripts read TOML with Python's tomllib (3.11+); Ubuntu 22.04 has 3.10.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The tag names the workspace version
        if: github.event_name == 'push'
        shell: bash
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not name the workspace version $version" >&2
            exit 1
          fi

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libfontconfig1-dev libvulkan-dev libssl-dev pkg-config

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup show

      # The third-party notices every bundle ships (script/generate-licenses).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      # A release compiles GPUI's Metal shaders at build time, which needs Xcode's compiler.
      - name: Metal compiler
        if: runner.os == 'macOS'
        run: xcrun -sdk macosx -f metal

      - name: Signing and notarization credentials
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "$APPLE_NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials studio-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER" --keychain "$keychain"
          rm "$RUNNER_TEMP/notary.p8"
          echo "STUDIO_SIGN_IDENTITY=$APPLE_SIGN_IDENTITY" >> "$GITHUB_ENV"
          echo "STUDIO_NOTARY_PROFILE=studio-notary" >> "$GITHUB_ENV"

      - name: Bundle (release build)
        shell: bash
        run: script/bundle-${{ runner.os == 'macOS' && 'mac' || runner.os == 'Windows' && 'windows' || 'linux' }}

      # The requirement `omnigraph studio` checks before it opens or installs Studio (RFC #1017).
      - name: The app passes the Developer ID requirement
        if: runner.os == 'macOS' && env.SIGNED == 'true'
        env:
          APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: |
          team=$(sed -nE 's/.*\(([A-Z0-9]{10})\)$/\1/p' <<< "$APPLE_SIGN_IDENTITY")
          if [[ -z "$team" ]]; then
            echo "APPLE_SIGN_IDENTITY names no team: \"Developer ID Application: Name (TEAMID)\"" >&2
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 \
            -R="identifier \"com.modernrelay.omnigraph-studio\" and anchor apple generic and certificate leaf[subject.OU] = \"$team\"" \
            "target/bundle/Omnigraph Studio.app"

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp target/bundle/*.dmg target/bundle/*.tar.gz target/bundle/*.zip dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # Signs the macOS update with the update key, apart from the builds: only for a tag, in the
  # `update-signing` environment, whose secrets no other job can read. Give that environment
  # required reviewers, so a workflow change or a dispatched run alone cannot sign a release
  # (spec 017, open question 2). The key's public half is committed; while it is empty, no
  # release is signed and Studio offers the download instead.
  sign-update:
    name: Sign the update
    needs: build
    # `edge` is skipped on a tag, so each job after it names the results it waits on.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: update-signing
    steps:
      - uses: actions/checkout@v7

      - name: Whether the update key is published
        id: key
        run: |
          if [[ -s crates/studio_update/update-key.pub ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.key.outputs.published == 'true'
        with:
          name: macos-arm64
          path: dist

      # Built from crates.io's source with its lock file, so the signer is the published crate.
      - name: cargo-packager
        if: steps.key.outputs.published == 'true'
        run: cargo install cargo-packager --version 0.11.8 --locked

      # Writes the .sig beside the update archive: base64 of its minisign signature.
      - name: Sign
        if: steps.key.outputs.published == 'true'
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.STUDIO_UPDATER_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.STUDIO_UPDATER_KEY_PASSWORD }}
        run: |
          if [[ -z "$CARGO_PACKAGER_SIGN_PRIVATE_KEY" ]]; then
            echo "update-key.pub is published, but the update-signing environment has no STUDIO_UPDATER_KEY" >&2
            exit 1
          fi
          shopt -s nullglob
          updates=(dist/*.app.tar.gz)
          if (( ${#updates[@]} != 1 )); then
            echo "expected one macOS update archive, found ${#updates[@]}" >&2
            exit 1
          fi
          cargo packager signer sign "${updates[0]}"

      # Every updating Studio checks the signature against the committed key; a release signed
      # with any other key would be downloaded and refused by every one of them.
      - name: The signature verifies with the committed key
        if: steps.key.outputs.published == 'true'
        run: |
          sudo apt-get install -y minisign
          base64 --decode crates/studio_update/update-key.pub > "$RUNNER_TEMP/update.pub"
          for update in dist/*.app.tar.gz; do
            base64 --decode "$update.sig" > "$RUNNER_TEMP/update.minisig"
            minisign -V -p "$RUNNER_TEMP/update.pub" -m "$update" -x "$RUNNER_TEMP/update.minisig"
          done

      - uses: actions/upload-artifact@v7
        if: steps.key.outputs.published == 'true'
        with:
          name: update-signature
          path: dist/*.sig
          if-no-files-found: error

  publish:
    name: Publish
    needs: [build, sign-update]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.build.result == 'success' && needs.sign-update.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The first-install files under names without the version, which `latest/download` always
      # serves, and latest.json for Studio's updater (spec 017).
      - name: Version-free copies and the update manifest
        run: python3 script/release-files.py dist "${GITHUB_REF_NAME#v}" crates/studio_update/update-key.pub

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ "$SIGNED" == "true" ]]; then
            mac="The macOS app is signed with a Developer ID and notarized."
          else
            mac="The macOS app is signed ad hoc, not notarized. macOS blocks it the first time: open System Settings → Privacy & Security and choose Open Anyway, or run \`xattr -dr com.apple.quarantine \"/Applications/Omnigraph Studio.app\"\` after moving it to Applications."
          fi
          cat > notes.md <<NOTES
          Omnigraph Studio $version, built from ${GITHUB_SHA::7} by the release workflow.

          | File | Platform |
          |---|---|
          | \`Omnigraph-Studio-$version-arm64.dmg\` | macOS 11 or later, Apple silicon |
          | \`omnigraph-studio-$version-linux-x86_64.tar.gz\` | Linux x86_64, glibc 2.35 or later (Ubuntu 22.04, Debian 12 and later); Wayland or X11, Vulkan |
          | \`omnigraph-studio-$version-linux-aarch64.tar.gz\` | Linux arm64, glibc 2.35 or later; Wayland or X11, Vulkan |
          | \`omnigraph-studio-$version-windows-x86_64.zip\` | Windows 10 (1809) or later, x86_64 |

          The same four files without the version in their names are always the newest release's, at \`https://github.com/$GITHUB_REPOSITORY/releases/latest/download/<name>\`. \`Omnigraph-Studio-$version-arm64.app.tar.gz\` with its \`.sig\`, and \`latest.json\`, are for Studio's own updater.

          \`SHA256SUMS\` lists every file's checksum. Each download carries \`LICENSE\` (GPL-3.0-or-later) and \`THIRD-PARTY-NOTICES.md\`, the licences of the crates, fonts, icons and themes it includes.

          $mac

          On Linux, unpack the tarball and run \`bin/omnigraph-studio\`; copy its \`share/\` into \`~/.local/share\` to list Studio, with its icon, in a launcher.

          On Windows, unzip anywhere and run \`omnigraph-studio.exe\`. It is not signed, so SmartScreen may ask first: choose More info, then Run anyway.

          Studio connects to an Omnigraph server of v0.14.0 or later (HTTP contract 0.14); see the README for connecting and for a sample graph. The servers of your \`omnigraph\` CLI's targets, and the agent panel, need that CLI at v0.14.0 or later.
          NOTES
          # A full release, so `latest` names it: Studio's updater and the CLI read it there. A
          # pre-release (`v0.3.0-rc.1`), or a release whose macOS app is not signed with the
          # Developer ID, which every updating Studio and `omnigraph studio` refuse, is published
          # as a pre-release, so no Studio installs it.
          if [[ "$version" == *-* || "$SIGNED" != "true" ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Omnigraph Studio $version" --notes-file notes.md "${flags[@]}"

  # Replaces the `edge` release with this build of main, under the release's version-free names
  # only. It never writes latest.json, so the edge build reaches no updater.
  publish-edge:
    name: Publish edge
    needs: [edge, build]
    if: ${{ !cancelled() && needs.edge.outputs.publish == 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: built
          merge-multiple: true

      - name: Version-free files and checksums
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          python3 script/release-files.py --edge built "$version" dist
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
        run: |
          date=$(git show -s --format=%cs HEAD)
          if [[ "$SIGNED" == "true" ]]; then
            mac="The macOS app is signed with a Developer ID and notarized."
          else
            mac="The macOS app is signed ad hoc, not notarized. macOS blocks it the first time: open System Settings → Privacy & Security and choose Open Anyway, or run \`xattr -dr com.apple.quarantine \"/Applications/Omnigraph Studio.app\"\` after moving it to Applications."
          fi
          cat > notes.md <<NOTES
          Omnigraph Studio built from main at ${GITHUB_SHA::7} ($date). The newest edge build replaces this one every day that main has changed.

          An edge build has passed CI on its commit. Studio does not update an edge build to the next edge build: download it again here. Its updater still offers it a full release whose version is newer than its own.

          | File | Platform |
          |---|---|
          | \`Omnigraph-Studio-arm64.dmg\` | macOS 11 or later, Apple silicon |
          | \`omnigraph-studio-linux-x86_64.tar.gz\` | Linux x86_64, glibc 2.35 or later |
          | \`omnigraph-studio-linux-aarch64.tar.gz\` | Linux arm64, glibc 2.35 or later |
          | \`omnigraph-studio-windows-x86_64.zip\` | Windows 10 (1809) or later, x86_64 |

          Each is at \`https://github.com/$GITHUB_REPOSITORY/releases/download/edge/<name>\`. \`SHA256SUMS\` lists every file's checksum.

          $mac
          NOTES
          # The release and its tag move to this commit: the old ones go first, so the tag is
          # made again at this commit.
          gh release delete edge --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes 2>/dev/null || true
          gh release create edge dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Omnigraph Studio edge" --notes-file notes.md --prerelease --latest=false
