[workspace]
resolver = "3"
members = [
    "crates/studio",
    "crates/studio_actions",
    "crates/studio_settings",
    "crates/studio_theme",
    "crates/studio_ui",
    "crates/studio_workspace",
    "crates/graph_client",
    "crates/graph_store",
    "crates/gq_language",
    "crates/command_palette",
    "crates/type_table",
    "crates/relationship_tree",
    "crates/graph_canvas",
    "crates/query_editor",
    "crates/review",
    "crates/history",
    "crates/inspectors",
    "crates/agent_panel",
    "grammars/tree-sitter-gq",
    "grammars/tree-sitter-pg",
]
default-members = ["crates/studio"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/ModernRelay/omnigraph-studio"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage", "CGPDFDocument", "CGPDFPage"] }
# Studio crates
tree-sitter-gq = { path = "grammars/tree-sitter-gq" }
tree-sitter-pg = { path = "grammars/tree-sitter-pg" }
studio_actions = { path = "crates/studio_actions" }
studio_settings = { path = "crates/studio_settings" }
studio_theme = { path = "crates/studio_theme" }
studio_ui = { path = "crates/studio_ui" }
studio_workspace = { path = "crates/studio_workspace" }
graph_client = { path = "crates/graph_client" }
graph_store = { path = "crates/graph_store" }
gq_language = { path = "crates/gq_language" }
command_palette = { path = "crates/command_palette" }
type_table = { path = "crates/type_table" }
relationship_tree = { path = "crates/relationship_tree" }
graph_canvas = { path = "crates/graph_canvas" }
query_editor = { path = "crates/query_editor" }
review = { path = "crates/review" }
history = { path = "crates/history" }
inspectors = { path = "crates/inspectors" }
agent_panel = { path = "crates/agent_panel" }

# Zed, one release tag for every crate (docs/zed-pin.md). GPL-3.0-or-later and Apache-2.0.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
gpui_tokio = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
ui = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
theme = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
component = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
icons = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
menu = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
refineable = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
sum_tree = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
collections = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
util = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
http_client = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
reqwest_client = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
editor = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
language = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
multi_buffer = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
settings = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
release_channel = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
theme_settings = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
assets = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }

# OmniGraph's parser and type checker. MIT; no Lance dependency.
omnigraph-compiler = { git = "https://github.com/ModernRelay/omnigraph", tag = "v0.13.0" }

# Third party
anyhow = "1"
futures = "0.3"
getrandom = "0.3"
httparse = "1"
percent-encoding = "2"
# The Agent Client Protocol at the version Zed v1.23.2 pins; stable v1 only (spec 011).
agent-client-protocol = "=2.2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
smol = "2"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
url = "2"

# Zed patches crates.io crates in its own workspace. Patches do not carry over to a crate that
# depends on Zed, so Studio repeats the ones its graph reaches. Copied from Zed v1.23.2
# Cargo.toml; recheck on every bump (docs/zed-pin.md).
[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

[profile.dev]
split-debuginfo = "unpacked"
debug = "limited"

# GPUI's layout and painting are slow unoptimized; keep them fast in debug builds.
[profile.dev.package.gpui]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
debug = "limited"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
