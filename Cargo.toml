[workspace]
resolver = "3"
members = [
    "crates/studio",
    "crates/studio_actions",
    "crates/studio_settings",
    "crates/studio_theme",
    "crates/studio_ui",
    "crates/studio_workspace",
    "crates/change_cards",
    "crates/graph_client",
    "crates/graph_store",
    "crates/gq_language",
    "crates/command_palette",
    "crates/type_table",
    "crates/relationship_tree",
    "crates/graph_canvas",
    "crates/query_editor",
    "crates/review",
    "crates/history",
    "crates/agent_panel",
    "crates/studio_update",
    "crates/oauth_client",
    "crates/model",
    "grammars/tree-sitter-gq",
    "grammars/tree-sitter-pg",
]
default-members = ["crates/studio"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
repository = "https://github.com/ModernRelay/omnigraph-studio"

[workspace.dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGAffineTransform", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage", "CGPDFDocument", "CGPDFPage"] }
# CommonMark, the parser Zed's `markdown` renders with: text values read as markdown (spec 014).
pulldown-cmark = { version = "0.13", default-features = false }
# Cuts and marks take whole characters as a reader sees them (a flag, an accented letter).
unicode-segmentation = "1.13"
# Studio crates
tree-sitter-gq = { path = "grammars/tree-sitter-gq" }
tree-sitter-pg = { path = "grammars/tree-sitter-pg" }
studio_actions = { path = "crates/studio_actions" }
studio_settings = { path = "crates/studio_settings" }
studio_theme = { path = "crates/studio_theme" }
studio_ui = { path = "crates/studio_ui" }
studio_workspace = { path = "crates/studio_workspace" }
change_cards = { path = "crates/change_cards" }
graph_client = { path = "crates/graph_client" }
graph_store = { path = "crates/graph_store" }
studio_update = { path = "crates/studio_update" }
oauth_client = { path = "crates/oauth_client" }
model = { path = "crates/model" }
gq_language = { path = "crates/gq_language" }
command_palette = { path = "crates/command_palette" }
type_table = { path = "crates/type_table" }
relationship_tree = { path = "crates/relationship_tree" }
graph_canvas = { path = "crates/graph_canvas" }
query_editor = { path = "crates/query_editor" }
review = { path = "crates/review" }
history = { path = "crates/history" }
agent_panel = { path = "crates/agent_panel" }

# Zed, one release tag for every crate (docs/zed-pin.md). GPL-3.0-or-later and Apache-2.0.
gpui = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
gpui_platform = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
ui = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
theme = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
menu = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
collections = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
util = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
http_client = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
reqwest_client = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
# The reqwest fork Zed v1.23.2 pins, with its features, for a CLI target that trusts its own
# certificate authority (spec 003): `reqwest_client` takes a `reqwest::Client` built with roots.
reqwest = { package = "zed-reqwest", git = "https://github.com/zed-industries/reqwest.git", rev = "33bc764aa15ff7b200bf7c93bd96e24878d53e14", default-features = false, features = ["charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream"] }
editor = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
markdown = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
language = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
settings = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
release_channel = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
zlog = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
theme_settings = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }
assets = { git = "https://github.com/zed-industries/zed", tag = "v1.26.2" }

# Omnigraph's parser and type checker. MIT; no Lance dependency.
omnigraph-compiler = { git = "https://github.com/ModernRelay/omnigraph", tag = "v0.14.0" }

# Third party
anyhow = "1"
futures = "0.3"
libc = "0.2"
log = "0.4"
getrandom = "0.3"
httparse = "1"
percent-encoding = "2"
# Opening directories by handle, for files written into a directory an agent also writes.
rustix = { version = "1.1", features = ["fs"] }
# The Agent Client Protocol at the version Zed v1.23.2 pins; stable v1 only (spec 011).
agent-client-protocol = "=2.2.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Studio's updater (spec 017): an update's minisign signature, checked against the update key.
minisign-verify = "0.2"
# Unpacking a downloaded update and reading its bundle's version before it is installed.
# The update key and signature are base64 of minisign's files, as Tauri writes them (spec 017).
base64 = "0.22"
# PKCE's code challenge is the verifier's SHA-256 (RFC 7636 §4.2, spec 016).
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
tempfile = "3"
# The agent's gateway serves HTTPS on loopback with a certificate it makes when it starts (spec
# 013): rustls, which Studio's HTTP client already builds, over smol, with ring as its provider.
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# The patterns of Omnigraph's operator-config schema, which the agent's CLI home is tested against.
regex = "1"
smol = "2"
schemars = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
# Floats parse to the value they were written from: a page's sort cursor or a cell's filter
# sends a float back to the server, which compares it exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Reading settings.json: where a value that does not fit is, and which keys do nothing.
serde_ignored = "0.1"
serde_path_to_error = "0.1"
# The maintained continuation of serde_yaml, which is deprecated and pulls in an unmaintained
# libyaml port.
serde_norway = "0.9"
url = "2"
# The agent's launcher on Windows; the version the ACP crate already uses.
windows-sys = "0.61"

# Zed patches crates.io crates in its own workspace. Patches do not carry over to a crate that
# depends on Zed, so Studio repeats the ones its graph reaches. Copied from Zed v1.23.2
# Cargo.toml; recheck on every bump (docs/zed-pin.md).
[patch.crates-io]
tree-sitter-language = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
notify = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
notify-types = { git = "https://github.com/zed-industries/notify", rev = "d842f16b2716bd60f09caf3ae3a894237ab38f54" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
# Avoid panicking when a failed EGL call reports EGL_SUCCESS (Zed's patch at the pin).
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

[profile.dev]
split-debuginfo = "unpacked"
debug = "limited"

# Built once for the build platform, as Zed does: without this, cargo builds the crates that
# build scripts and proc-macros use a second time.
[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

# GPUI's layout and painting, its layout engine, SVG rendering and JSON parsing are slow
# unoptimized; keep them fast in debug builds (Zed's list, for what Studio uses). Proc-macros
# run at every build, so optimizing them speeds builds up.
[profile.dev.package]
gpui = { opt-level = 2 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
settings_macros = { opt-level = 3 }
ui_macros = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "limited"

# Optimized but quick to build, for measuring (as Zed's): `--profile release-fast`.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
