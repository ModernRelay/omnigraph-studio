[package]
name = "agent_panel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/agent_panel.rs"

[dependencies]
agent-client-protocol = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
editor = { workspace = true }
futures = { workspace = true }
# The gateway's TLS and the certificate it makes when it starts (spec 013).
futures-rustls = { workspace = true }
getrandom = { workspace = true }
gpui = { workspace = true }
url = { workspace = true }
gq_language = { workspace = true }
httparse = { workspace = true }
graph_client = { workspace = true }
graph_store = { workspace = true }
menu = { workspace = true }
percent-encoding = { workspace = true }
rcgen = { workspace = true }
# Zed's markdown renderer for agent replies; `editor` already builds it.
markdown = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol = { workspace = true }
studio_actions = { workspace = true }
studio_settings = { workspace = true }
studio_ui = { workspace = true }
studio_workspace = { workspace = true }
ui = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
uds_windows = { workspace = true }
# The agent's launcher holds the agent in a job that ends with it; `confined` holds the agent's
# folders open while Studio writes in them; `requester` finds the processes a gateway client
# was started under.
windows-sys = { workspace = true, features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# The CLI choice's stand-ins are scripts each test writes, whose first run can wait for macOS's
# scan of it: `test-support` lifts the bound on the CLI's answers (`graph_store::cli::READ_TIMEOUT`).
graph_store = { workspace = true, features = ["test-support"] }
http_client = { workspace = true }
# The CLI home's config checked against Omnigraph's operator-config JSON Schema.
regex = { workspace = true }
reqwest_client = { workspace = true }
serde_norway = { workspace = true }
# A conversation tab drawn in a test window: Studio's settings and theme held in memory.
studio_settings = { workspace = true, features = ["test-support"] }
studio_theme = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
