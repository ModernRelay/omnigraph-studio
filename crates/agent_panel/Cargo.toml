[package]
name = "agent_panel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/agent_panel.rs"

[dependencies]
agent-client-protocol = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
editor = { workspace = true }
futures = { workspace = true }
getrandom = { workspace = true }
gpui = { workspace = true }
url = { workspace = true }
gq_language = { workspace = true }
httparse = { workspace = true }
graph_client = { workspace = true }
graph_store = { workspace = true }
menu = { workspace = true }
percent-encoding = { workspace = true }
# Zed's markdown renderer for agent replies; `editor` already builds it.
markdown = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol = { workspace = true }
studio_actions = { workspace = true }
studio_settings = { workspace = true }
studio_ui = { workspace = true }
studio_workspace = { workspace = true }
ui = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
uds_windows = { workspace = true }
# The agent's launcher holds the agent in a job that ends with it.
windows-sys = { workspace = true, features = [
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true }
reqwest_client = { workspace = true }

[lints]
workspace = true
