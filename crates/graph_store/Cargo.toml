[package]
name = "graph_store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/graph_store.rs"

[dependencies]
futures = { workspace = true }
gpui = { workspace = true }
graph_client = { workspace = true }
gq_language = { workspace = true }
http_client = { workspace = true }
reqwest_client = { workspace = true }
reqwest = { workspace = true }
studio_settings = { workspace = true }
studio_ui = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
smol = { workspace = true }
url = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
futures-rustls = { workspace = true }
rcgen = { workspace = true }

[features]
# The fake server (`test_server`), for the tests of crates that show a session.
test-support = ["gpui/test-support"]

[lints]
workspace = true
