[package]
name = "query_editor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/query_editor.rs"

[dependencies]
gpui = { workspace = true }
ui = { workspace = true }
editor = { workspace = true }
language = { workspace = true }
menu = { workspace = true }
# Zed's completion types (`Completion`, `CompletionResponse`) live in `project`; `editor`
# already builds it, so this adds no crate to the graph.
project = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
# The hover provider's signatures name these; `editor` already builds both.
collections = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
clock = { git = "https://github.com/zed-industries/zed", tag = "v1.23.2" }
studio_ui = { workspace = true }
studio_actions = { workspace = true }
studio_workspace = { workspace = true }
graph_client = { workspace = true }
graph_store = { workspace = true }
gq_language = { workspace = true }
tree-sitter-gq = { workspace = true }
tree-sitter-pg = { workspace = true }
# The same revision `language` builds; it turns the grammar into a `tree_sitter::Language`.
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "43623ec9bf0eaaf7113285c46e8a09018f181b18" }
studio_settings = { workspace = true }
anyhow = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
http_client = { workspace = true }
studio_theme = { workspace = true, features = ["test-support"] }
studio_workspace = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
