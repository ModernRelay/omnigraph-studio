[package]
name = "studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "OmniGraph Studio"

[lib]
path = "src/lib.rs"

[[bin]]
name = "omnigraph-studio"
path = "src/main.rs"

[features]
default = ["runtime-shaders"]
# Compile GPUI's Metal shaders when the app starts instead of at build time, so a build needs
# only the Command Line Tools, not full Xcode. Release builds use `--no-default-features` on a
# machine with Xcode to precompile them (specs/001-foundation/plan.md).
runtime-shaders = ["gpui_platform/runtime_shaders"]

[dependencies]
gpui = { workspace = true }
ui = { workspace = true }
theme = { workspace = true }
editor = { workspace = true }
settings = { workspace = true }
release_channel = { workspace = true }
menu = { workspace = true }
studio_actions = { workspace = true }
studio_settings = { workspace = true }
studio_theme = { workspace = true }
studio_ui = { workspace = true }
studio_workspace = { workspace = true }
graph_client = { workspace = true }
graph_store = { workspace = true }
gq_language = { workspace = true }
command_palette = { workspace = true }
type_table = { workspace = true }
relationship_tree = { workspace = true }
graph_canvas = { workspace = true }
query_editor = { workspace = true }
agent_panel = { workspace = true }
review = { workspace = true }
history = { workspace = true }
inspectors = { workspace = true }

# Text needs `font-kit` on macOS; Linux needs a windowing backend.
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { workspace = true, features = ["font-kit"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
gpui_platform = { workspace = true }

[[test]]
name = "settings_apply"
harness = false

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support", "font-kit", "runtime_shaders"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { workspace = true }

[lints]
workspace = true
