[package]
name = "studio_theme"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
path = "src/studio_theme.rs"

[dependencies]
gpui = { workspace = true }
log = { workspace = true }
theme = { workspace = true }
theme_settings = { workspace = true }
settings = { workspace = true }
assets = { workspace = true }
release_channel = { workspace = true }
semver = { workspace = true }
# Zed's dev builds read assets from the nearest git checkout at run time, which for Studio is
# Studio's own repository. Embed Zed's assets at compile time in every profile instead.
util = { workspace = true, features = ["debug-embed"] }

[features]
# `init_test` for other crates' tests.
test-support = []

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
