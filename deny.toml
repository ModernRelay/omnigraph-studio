# cargo-deny policy (constitution XI).

[graph]
all-features = false

[licenses]
# Studio is GPL-3.0-or-later. Everything linked into it must be GPL-3.0 compatible.
allow = [
    "GPL-3.0-or-later",
    "GPL-3.0-only",
    "LGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "OFL-1.1",
    "CDLA-Permissive-2.0",
]
# "BSL-1.0" above is the Boost licence. The Business Source License is not an SPDX identifier
# cargo-deny allows; review any crate that declares it and refuse it.
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
# Exactly one GPUI in the build (constitution XI).
deny = [
    { name = "gpui-pre" },
    { name = "gpui-ce" },
    { name = "gpui-kit" },
    { name = "gpui-component" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/zed-industries/zed",
    "https://github.com/ModernRelay/omnigraph",
    # Zed's own git dependencies and patches at the pinned tag.
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/smol-rs/async-task.git",
    "https://github.com/tree-sitter/tree-sitter",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/notify",
    "https://github.com/zed-industries/reqwest.git",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/xim-rs.git",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/lsp-types",
]
