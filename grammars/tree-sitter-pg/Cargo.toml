[package]
name = "tree-sitter-pg"
description = "Tree-sitter grammar for Omnigraph schemas (.pg), for Studio's schema view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "bindings/rust/build.rs"
include = ["bindings/rust/*", "grammar.js", "queries/*", "src/*"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1"

[dev-dependencies]
tree-sitter = { git = "https://github.com/tree-sitter/tree-sitter", rev = "803c6ebaac27d69e1808b45058482e868d073ceb" }
